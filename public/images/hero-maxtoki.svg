<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1e3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="cellGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="bigBlur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" /><line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" /><line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" /><line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="400" x2="1200" y2="400" /><line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="500" x2="1200" y2="500" /><line x1="0" y1="550" x2="1200" y2="550" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="50" y1="0" x2="50" y2="630" />
    <line x1="100" y1="0" x2="100" y2="630" /><line x1="150" y1="0" x2="150" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" /><line x1="250" y1="0" x2="250" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" /><line x1="350" y1="0" x2="350" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" /><line x1="450" y1="0" x2="450" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" /><line x1="550" y1="0" x2="550" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" /><line x1="650" y1="0" x2="650" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" /><line x1="750" y1="0" x2="750" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" /><line x1="850" y1="0" x2="850" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" /><line x1="950" y1="0" x2="950" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" /><line x1="1050" y1="0" x2="1050" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" /><line x1="1150" y1="0" x2="1150" y2="630" />
    <line x1="1200" y1="0" x2="1200" y2="630" />
  </g>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="300" r="200" fill="#76b900" opacity="0.06" filter="url(#bigBlur)" />
  <circle cx="900" cy="350" r="250" fill="#06b6d4" opacity="0.06" filter="url(#bigBlur)" />
  <circle cx="600" cy="200" r="150" fill="#8b5cf6" opacity="0.04" filter="url(#bigBlur)" />

  <!-- Cell illustrations (left side) -->
  <g transform="translate(100, 250)">
    <!-- Cell 1 -->
    <circle cx="0" cy="0" r="55" fill="url(#cellGlow)" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
    <circle cx="-10" cy="-8" r="18" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5" />
    <circle cx="5" cy="12" r="6" fill="#06b6d4" opacity="0.3" />
    <circle cx="-15" cy="15" r="4" fill="#8b5cf6" opacity="0.3" />
    <text x="0" y="80" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">t=0</text>
  </g>

  <!-- Arrow 1 -->
  <g>
    <line x1="170" y1="250" x2="260" y2="250" stroke="url(#glow)" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="260,245 275,250 260,255" fill="#76b900" opacity="0.8" />
    <text x="215" y="235" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="10" opacity="0.8">tokenize</text>
  </g>

  <!-- Token sequence visualization -->
  <g transform="translate(290, 220)">
    <rect x="0" y="0" width="32" height="60" rx="4" fill="#76b900" opacity="0.15" stroke="#76b900" stroke-width="1" />
    <text x="16" y="35" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="9">BOS</text>
    <rect x="38" y="0" width="32" height="60" rx="4" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="54" y="30" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="8">TP53</text>
    <text x="54" y="42" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="7">#1</text>
    <rect x="76" y="0" width="32" height="60" rx="4" fill="#06b6d4" opacity="0.12" stroke="#06b6d4" stroke-width="1" />
    <text x="92" y="30" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="8">BRCA</text>
    <text x="92" y="42" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="7">#2</text>
    <rect x="114" y="0" width="32" height="60" rx="4" fill="#06b6d4" opacity="0.09" stroke="#06b6d4" stroke-width="1" />
    <text x="130" y="35" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">...</text>
    <rect x="152" y="0" width="32" height="60" rx="4" fill="#76b900" opacity="0.15" stroke="#76b900" stroke-width="1" />
    <text x="168" y="35" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="9">EOS</text>
    <text x="92" y="80" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Rank-Value Encoded</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <line x1="485" y1="250" x2="545" y2="250" stroke="url(#glow)" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="545,245 560,250 545,255" fill="#06b6d4" opacity="0.8" />
  </g>

  <!-- Transformer block -->
  <g transform="translate(570, 180)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
    <text x="90" y="25" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">LLaMA Transformer</text>
    <line x1="15" y1="35" x2="165" y2="35" stroke="#334155" stroke-width="1" />
    <text x="90" y="55" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">217M params</text>
    <text x="90" y="72" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">11 layers x 8 heads</text>
    <text x="90" y="89" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">hidden: 1,232</text>
    <text x="90" y="106" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ctx: 16,384 tokens</text>
    <rect x="20" y="115" width="65" height="18" rx="3" fill="#76b900" opacity="0.2" stroke="#76b900" stroke-width="0.8" />
    <text x="52" y="128" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="8">NextCell</text>
    <rect x="95" y="115" width="65" height="18" rx="3" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="127" y="128" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="8">TimeBtwn</text>
  </g>

  <!-- Arrow 3 -->
  <g>
    <line x1="760" y1="250" x2="830" y2="200" stroke="#76b900" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="825,195 840,195 830,208" fill="#76b900" opacity="0.8" />
    <line x1="760" y1="250" x2="830" y2="310" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="825,315 840,315 830,302" fill="#8b5cf6" opacity="0.8" />
  </g>

  <!-- Output: Next Cell State -->
  <g transform="translate(850, 160)">
    <circle cx="50" cy="35" r="40" fill="url(#cellGlow)" stroke="#76b900" stroke-width="1.5" opacity="0.7" />
    <circle cx="40" cy="28" r="14" fill="none" stroke="#76b900" stroke-width="1" opacity="0.5" />
    <circle cx="55" cy="42" r="5" fill="#76b900" opacity="0.3" />
    <text x="50" y="95" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="11" font-weight="bold">Next Cell State</text>
    <text x="50" y="110" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">t=1 predicted</text>
  </g>

  <!-- Output: Time Prediction -->
  <g transform="translate(850, 295)">
    <rect x="5" y="0" width="90" height="40" rx="6" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="50" y="18" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="12" font-weight="bold">dt = 4.2h</text>
    <text x="50" y="32" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">predicted</text>
    <text x="50" y="60" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11" font-weight="bold">Time Elapsed</text>
  </g>

  <!-- Title -->
  <text x="600" y="490" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="-1">
    maxToki Deep Dive
  </text>
  <text x="600" y="525" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">
    NVIDIA's Autoregressive Cell Language Model
  </text>

  <!-- Bottom accent line -->
  <rect x="200" y="555" width="800" height="2" rx="1" fill="url(#glow)" opacity="0.5" />

  <!-- NVIDIA badge -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="100" height="28" rx="4" fill="#76b900" opacity="0.15" stroke="#76b900" stroke-width="1" />
    <text x="50" y="19" text-anchor="middle" fill="#76b900" font-family="sans-serif" font-size="12" font-weight="bold">NVIDIA</text>
  </g>

  <!-- BioNeMo badge -->
  <g transform="translate(160, 30)">
    <rect x="0" y="0" width="100" height="28" rx="4" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="50" y="19" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="bold">BioNeMo</text>
  </g>

  <!-- DNA helix decoration -->
  <g opacity="0.1" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <path d="M1100,100 Q1120,150 1100,200 Q1080,250 1100,300 Q1120,350 1100,400 Q1080,450 1100,500" />
    <path d="M1130,100 Q1110,150 1130,200 Q1150,250 1130,300 Q1110,350 1130,400 Q1150,450 1130,500" />
    <line x1="1100" y1="125" x2="1130" y2="125" /><line x1="1100" y1="175" x2="1130" y2="175" />
    <line x1="1100" y1="225" x2="1130" y2="225" /><line x1="1100" y1="275" x2="1130" y2="275" />
    <line x1="1100" y1="325" x2="1130" y2="325" /><line x1="1100" y1="375" x2="1130" y2="375" />
    <line x1="1100" y1="425" x2="1130" y2="425" /><line x1="1100" y1="475" x2="1130" y2="475" />
  </g>
</svg>