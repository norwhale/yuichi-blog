<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cell{display:flex;flex-direction:column;gap:6px}
  .img{aspect-ratio:2/1;background:
       linear-gradient(135deg,#0F172A 0%,#1E3A8A 100%);
       position:relative;overflow:hidden}
  .img.gs{filter:grayscale(1);opacity:.8}
  .img::after{content:'';position:absolute;inset:0;background:
    radial-gradient(circle at 25% 40%,rgba(255,255,255,.25),transparent 50%),
    radial-gradient(circle at 70% 70%,rgba(6,182,212,.35),transparent 55%)}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#64748B;letter-spacing:.02em}
  .title{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
         text-transform:uppercase;letter-spacing:.2em;display:block;margin-bottom:10px}
</style></head><body>
  <span class="title">Image treatment · rest / hover</span>
  <div class="row">
    <div class="cell"><div class="img gs"></div><span class="lab">grayscale · opacity .8 · sharp corners</span></div>
    <div class="cell"><div class="img" style="transform:scale(1.05)"></div><span class="lab">full color · opacity 1 · scale 1.05</span></div>
  </div>
</body></html>
