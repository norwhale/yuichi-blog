<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;
        box-shadow:4px 4px 0 0 rgba(15,23,42,.05);padding:16px;position:relative;overflow:hidden}
  .card.tl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:#06B6D4}
  .mono{font-family:var(--yb-font-mono);font-size:11px;color:#64748B;letter-spacing:.02em}
  .title{font-weight:600;font-size:15px;margin:4px 0 6px;line-height:1.3}
  .body{font-size:13px;color:#64748B;line-height:1.5}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
       text-transform:uppercase;letter-spacing:.2em;margin-bottom:10px;display:block}
</style></head><body>
  <span class="lab">Article card · rest / hover</span>
  <div class="wrap">
    <div class="card">
      <span class="mono">2026.04.09 · 6 min read</span>
      <div class="title">I Built My Own 'Her' Samantha</div>
      <div class="body">A weekend in Pleven with SwiftUI, Claude API, and Vibe Coding.</div>
    </div>
    <div class="card tl" style="box-shadow:6px 6px 0 0 rgba(15,23,42,.08)">
      <span class="mono">2026.04.09 · 6 min read</span>
      <div class="title" style="color:#06B6D4">I Built My Own 'Her' Samantha</div>
      <div class="body">A weekend in Pleven with SwiftUI, Claude API, and Vibe Coding.</div>
    </div>
  </div>
</body></html>
