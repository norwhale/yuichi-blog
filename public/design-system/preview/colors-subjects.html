<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#F8FAFC;font-family:var(--yb-font-sans)}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{aspect-ratio:1.2;border-radius:10px;padding:10px;
      display:flex;flex-direction:column;justify-content:space-between;
      box-shadow:var(--yb-shadow-rigid)}
  .n{font-family:var(--yb-font-mono);font-size:10px;color:#fff;
     text-transform:uppercase;letter-spacing:.15em}
  .h{font-family:var(--yb-font-mono);font-size:10px;color:#fff;opacity:.85;align-self:flex-end}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#22C55E"><span class="n">chem</span><span class="h">#22C55E</span></div>
  <div class="sw" style="background:#3B82F6"><span class="n">bio</span><span class="h">#3B82F6</span></div>
  <div class="sw" style="background:#EAB308"><span class="n">english</span><span class="h">#EAB308</span></div>
  <div class="sw" style="background:#F97316"><span class="n">physics</span><span class="h">#F97316</span></div>
  <div class="sw" style="background:#A855F7"><span class="n">bci</span><span class="h">#A855F7</span></div>
</div>
</body></html>
