<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:26px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .b{width:130px;height:80px;background:#fff;border:1px solid #E2E8F0;border-radius:12px}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#64748B;text-align:center;max-width:160px}
  .tok{font-family:var(--yb-font-mono);font-size:11px;color:#0F172A;font-weight:600}
  .title{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
         text-transform:uppercase;letter-spacing:.2em;margin-bottom:16px;display:block}
</style></head><body>
  <span class="title">Shadows</span>
  <div class="row">
    <div class="cell"><div class="b" style="box-shadow:4px 4px 0 0 rgba(15,23,42,.05)"></div><span class="tok">rigid</span><span class="lab">4px 4px 0 · signature</span></div>
    <div class="cell"><div class="b" style="box-shadow:6px 6px 0 0 rgba(15,23,42,.08)"></div><span class="tok">rigid-lg</span><span class="lab">hover state</span></div>
    <div class="cell"><div class="b" style="box-shadow:0 8px 30px -12px rgba(15,23,42,.12)"></div><span class="tok">soft</span><span class="lab">floating chrome</span></div>
  </div>
</body></html>
