<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-family:var(--yb-font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#64748B}
  input{font:400 14px var(--yb-font-sans);padding:10px 12px;border:1px solid #E2E8F0;
        border-radius:10px;background:#fff;color:#0F172A;outline:0;
        transition:border-color .16s, box-shadow .16s}
  input:focus{border-color:#06B6D4;box-shadow:0 0 0 3px rgba(6,182,212,.15)}
  .search{grid-column:1/-1;position:relative}
  .search input{padding-left:36px;width:100%;box-sizing:border-box}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94A3B8}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
       text-transform:uppercase;letter-spacing:.2em;display:block;margin-bottom:10px}
</style></head><body>
  <span class="lab">Form inputs</span>
  <div class="wrap">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input placeholder="Search logbook…">
    </div>
    <div class="field"><label>Email</label><input placeholder="you@domain.com"></div>
    <div class="field"><label>Name</label><input value="Yuichi" style="border-color:#06B6D4;box-shadow:0 0 0 3px rgba(6,182,212,.15)"></div>
  </div>
</body></html>
