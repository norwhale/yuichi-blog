<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#F8FAFC;font-family:var(--yb-font-sans)}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .sw{aspect-ratio:1.4;border-radius:10px;border:1px solid var(--yb-border);
      padding:10px;display:flex;flex-direction:column;justify-content:space-between;
      box-shadow:var(--yb-shadow-rigid)}
  .sw .n{font-family:var(--yb-font-mono);font-size:10px;color:#fff;opacity:.85;
        text-transform:uppercase;letter-spacing:.15em}
  .sw .h{font-family:var(--yb-font-mono);font-size:10px;color:#fff;opacity:.9;align-self:flex-end}
  .sw.lite .n,.sw.lite .h{color:#0F172A}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#F8FAFC"><span class="n" style="color:#64748B">bg</span><span class="h" style="color:#64748B">#F8FAFC</span></div>
  <div class="sw lite" style="background:#FFFFFF"><span class="n">card</span><span class="h">#FFFFFF</span></div>
  <div class="sw" style="background:#0F172A"><span class="n">fg</span><span class="h">#0F172A</span></div>
  <div class="sw" style="background:#64748B"><span class="n">muted</span><span class="h">#64748B</span></div>
  <div class="sw lite" style="background:#E2E8F0"><span class="n">border</span><span class="h">#E2E8F0</span></div>
  <div class="sw lite" style="background:#F1F5F9"><span class="n">sunken</span><span class="h">#F1F5F9</span></div>
</div>
</body></html>
