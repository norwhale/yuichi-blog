<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        font-family:var(--yb-font-mono);font-size:11px;letter-spacing:.02em;
        border:1px solid;background:#fff}
  .dot{width:6px;height:6px;border-radius:999px;display:inline-block}
  .pulse{animation:p 1.8s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
       text-transform:uppercase;letter-spacing:.2em;display:block;margin-bottom:12px}
</style></head><body>
  <span class="lab">Status badges</span>
  <div class="row">
    <span class="chip" style="border-color:#BBF7D0;color:#15803D"><span class="dot pulse" style="background:#22C55E"></span>ONLINE</span>
    <span class="chip" style="border-color:#BAE6FD;color:#0E7490"><span class="dot pulse" style="background:#06B6D4"></span>WRITING</span>
    <span class="chip" style="border-color:#E2E8F0;color:#64748B"><span class="dot" style="background:#94A3B8"></span>IDLE</span>
    <span class="chip" style="border-color:#FECACA;color:#B91C1C"><span class="dot pulse" style="background:#EF4444"></span>OFFLINE</span>
    <span class="chip" style="border-color:#E2E8F0;color:#0F172A">v2.0</span>
  </div>
</body></html>
