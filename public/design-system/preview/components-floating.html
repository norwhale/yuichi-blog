<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:#0F172A;font-family:var(--yb-font-sans);color:#F1F5F9;height:220px;display:flex;align-items:flex-end;justify-content:flex-end;padding:22px;gap:12px;box-sizing:border-box}
  .chrome{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);
          border:1px solid rgba(255,255,255,.1);border-radius:999px;
          padding:10px 16px;display:flex;align-items:center;gap:10px;
          box-shadow:0 8px 30px -12px rgba(0,0,0,.4)}
  .chrome.sq{border-radius:16px;padding:12px 16px;width:280px}
  .mono{font-family:var(--yb-font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#94A3B8}
  .play{width:28px;height:28px;border-radius:999px;background:#06B6D4;color:#0F172A;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .bot{width:36px;height:36px;border-radius:999px;background:linear-gradient(135deg,#06B6D4,#1E3A8A);display:flex;align-items:center;justify-content:center;font-family:var(--yb-font-mono);font-weight:700;font-size:13px;color:#fff}
  .lab{position:absolute;left:20px;top:14px;font-family:var(--yb-font-mono);font-size:10px;
       color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.2em}
</style></head><body>
  <span class="lab">Floating chrome · BGM + Samantha</span>
  <div class="chrome">
    <div class="play">▶</div>
    <span class="mono">Ambient Vibe</span>
  </div>
  <div class="chrome">
    <div class="bot">S</div>
    <div>
      <div style="font-size:13px;font-weight:600">Samantha</div>
      <div class="mono" style="font-size:10px">Article navigator</div>
    </div>
  </div>
</body></html>
