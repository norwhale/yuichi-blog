<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .row{display:flex;gap:14px;align-items:flex-end}
  .stack{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{background:#06B6D4;border-radius:2px}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#64748B}
  .tok{font-family:var(--yb-font-mono);font-size:10px;color:#0F172A;font-weight:500}
  .title{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
         text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px;display:block}
</style></head><body>
  <span class="title">Spacing scale (4-based)</span>
  <div class="row">
    <div class="stack"><div class="box" style="width:4px;height:4px"></div><span class="tok">4</span><span class="lab">1</span></div>
    <div class="stack"><div class="box" style="width:8px;height:8px"></div><span class="tok">8</span><span class="lab">2</span></div>
    <div class="stack"><div class="box" style="width:12px;height:12px"></div><span class="tok">12</span><span class="lab">3</span></div>
    <div class="stack"><div class="box" style="width:16px;height:16px"></div><span class="tok">16</span><span class="lab">4</span></div>
    <div class="stack"><div class="box" style="width:24px;height:24px"></div><span class="tok">24</span><span class="lab">6</span></div>
    <div class="stack"><div class="box" style="width:32px;height:32px"></div><span class="tok">32</span><span class="lab">8</span></div>
    <div class="stack"><div class="box" style="width:48px;height:48px"></div><span class="tok">48</span><span class="lab">12</span></div>
    <div class="stack"><div class="box" style="width:64px;height:64px"></div><span class="tok">64</span><span class="lab">16</span></div>
    <div class="stack"><div class="box" style="width:96px;height:96px"></div><span class="tok">96</span><span class="lab">24</span></div>
  </div>
</body></html>
