<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:#F8FAFC;font-family:var(--yb-font-sans);color:#0F172A}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .logo{width:72px;height:72px;border-radius:6px;background:#0F172A;display:flex;align-items:center;justify-content:center;
        font-family:var(--yb-font-mono);color:#fff;font-weight:700;font-size:26px;letter-spacing:.02em}
  .logo.inv{background:#fff;color:#0F172A;border:1.5px solid #0F172A}
  .logo.sm{width:36px;height:36px;font-size:14px;border-radius:4px}
  .lab{font-family:var(--yb-font-mono);font-size:10px;color:#64748B;text-align:center}
  .title{font-family:var(--yb-font-mono);font-size:10px;color:#94A3B8;
         text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px;display:block}
</style></head><body>
  <span class="title">YB monogram</span>
  <div class="row">
    <div class="tile"><div class="logo">YB</div><span class="lab">primary · 64px</span></div>
    <div class="tile"><div class="logo inv">YB</div><span class="lab">inverse</span></div>
    <div class="tile"><div class="logo sm">YB</div><span class="lab">navbar · 32px</span></div>
  </div>
</body></html>
